<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>THEㅤ⚔ㅤCONQUEROR</title>

<link rel="icon"
type="image/png"
href="logo.png">

<link rel="manifest"
href="manifest.json">


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    font-family: Arial, sans-serif;

    color: white;

    background:

        linear-gradient(
            rgba(5,7,11,0.88),
            rgba(5,7,11,0.94)
        ),

        url("logo.png");

    background-size: 420px;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;

}


.card {

    width: 100%;

    max-width: 430px;

    background:
        rgba(13,18,29,0.96);

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius: 24px;

    padding: 28px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.5);

}


.guild-logo {

    width: 110px;

    height: 110px;

    object-fit: contain;

    display: block;

    margin: 0 auto 15px;

}


h1 {

    text-align: center;

    font-size: 24px;

    margin: 8px 0;

}


.subtitle {

    text-align: center;

    color: #aab4c7;

    font-size: 14px;

    margin-bottom: 25px;

}


label {

    display: block;

    color: #b9c2d3;

    font-size: 13px;

    margin-bottom: 8px;

}


.gender-buttons {

    display: flex;

    gap: 10px;

}


.gender-buttons button {

    flex: 1;

}


.gender-buttons button.active {

    background: #7f8da8;

    color: white;

}


input {

    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid #344056;

    background: #080c14;

    color: white;

    font-size: 16px;

    outline: none;

}


input:focus {

    border-color: #8c9ab5;

}


.preview {

    margin-top: 20px;

    padding: 22px 10px;

    background: #080c14;

    border:
        1px solid #344056;

    border-radius: 16px;

    text-align: center;

    overflow-x: auto;

}


.preview-title {

    color: #8792a7;

    font-size: 12px;

    margin-bottom: 10px;

}


#result {

    font-size: 22px;

    font-weight: bold;

    white-space: nowrap;

}


button {

    width: 100%;

    margin-top: 14px;

    padding: 14px;

    border: none;

    border-radius: 13px;

    background: white;

    color: #080b12;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


button:active {

    transform: scale(0.98);

}


.info {

    text-align: center;

    margin-top: 18px;

    color: #778298;

    font-size: 11px;

}

</style>

</head>


<body>


<div class="card">


    <!-- GUILD LOGO -->

    <img

        src="logo.png"

        alt="THEㅤ⚔ㅤCONQUEROR Logo"

        class="guild-logo"

    >


    <!-- GUILD NAME -->

    <h1>

        THEㅤ⚔ㅤCONQUEROR

    </h1>


    <div class="subtitle">

        Guild Name Generator

    </div>


    <!-- STYLE -->

    <label>

        Choose your style

    </label>


    <div class="gender-buttons">


        <button

            id="maleBtn"

            class="active"

            onclick="selectStyle('male')">

            ⚔ MALE

        </button>


        <button

            id="femaleBtn"

            onclick="selectStyle('female')">

            ♡ FEMALE

        </button>


    </div>


    <!-- NAME INPUT -->

    <label

        for="name"

        style="margin-top:20px;">

        Enter your Free Fire name

    </label>


    <input

        id="name"

        type="text"

        maxlength="20"

        placeholder="Enter your name"

        autocomplete="off"

        oninput="generateName()"

    >


    <!-- PREVIEW -->

    <div class="preview">


        <div class="preview-title">

            YOUR GUILD NAME

        </div>


        <div id="result">

            TCㅤ⚔ㅤＮＡＭＥ

        </div>


    </div>


    <!-- COPY BUTTON -->

    <button onclick="copyName()">

        📋 COPY NAME

    </button>


    <div class="info">

        Official THEㅤ⚔ㅤCONQUEROR name format

    </div>


</div>


<script>


let selectedStyle = "male";


const MALE_PREFIX =

    "TCㅤ⚔ㅤ";


const FEMALE_PREFIX =

    "TCㅤ♡ㅤ";


function fullWidth(text) {


    return [...text].map(character => {


        const code =

            character.charCodeAt(0);


        if (

            code >= 33 &&

            code <= 126

        ) {


            return String.fromCharCode(

                code + 65248

            );

        }


        if (

            character === " "

        ) {


            return "　";

        }


        return character;


    }).join("");

}


function selectStyle(style) {


    selectedStyle = style;


    const maleBtn =

        document.getElementById(

            "maleBtn"

        );


    const femaleBtn =

        document.getElementById(

            "femaleBtn"

        );


    if (

        style === "male"

    ) {


        maleBtn.classList.add(

            "active"

        );


        femaleBtn.classList.remove(

            "active"

        );


    }

    else {


        femaleBtn.classList.add(

            "active"

        );


        maleBtn.classList.remove(

            "active"

        );


    }


    generateName();

}


function generateName() {


    const name =

        document.getElementById(

            "name"

        ).value.trim();


    const result =

        document.getElementById(

            "result"

        );


    if (

        name.length === 0

    ) {


        if (

            selectedStyle === "male"

        ) {


            result.textContent =

                "TCㅤ⚔ㅤＮＡＭＥ";


        }

        else {


            result.textContent =

                "TCㅤ♡ㅤＦＥＭＡＬＥＮＡＭＥ";


        }


        return;

    }


    const prefix =

        selectedStyle === "male"

        ? MALE_PREFIX

        : FEMALE_PREFIX;


    result.textContent =

        prefix + fullWidth(name);

}


async function copyName() {


    const result =

        document.getElementById(

            "result"

        ).textContent;


    if (

        result ===

        "TCㅤ⚔ㅤＮＡＭＥ"

        ||

        result ===

        "TCㅤ♡ㅤＦＥＭＡＬＥＮＡＭＥ"

    ) {


        alert(

            "Enter your name first!"

        );


        return;

    }


    try {


        await navigator.clipboard.writeText(

            result

        );


        alert(

            "Copied: " + result

        );


    }


    catch (error) {


        const temporary =

            document.createElement(

                "textarea"

            );


        temporary.value = result;


        document.body.appendChild(

            temporary

        );


        temporary.select();


        document.execCommand(

            "copy"

        );


        temporary.remove();


        alert(

            "Name copied!"

        );

    }

}

</script>


</body>

</html>
