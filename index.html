<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ᴛʜᴇㅤᴄᴏɴǫᴜᴇʀᴏʀ</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 16px;

  font-family: Arial, sans-serif;
  color: white;

  background:
    linear-gradient(
      rgba(5,7,11,0.90),
      rgba(5,7,11,0.96)
    ),
    url("logo.png");

  background-size: 380px;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.card {
  width: 100%;
  max-width: 430px;

  background: rgba(13,18,29,0.97);

  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;

  padding: 26px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.55);
}

.guild-logo {
  width: 105px;
  height: 105px;

  object-fit: contain;

  display: block;

  margin: 0 auto 12px;
}

h1 {
  text-align: center;
  font-size: 23px;
  margin: 8px 0;
}

.subtitle {
  text-align: center;
  color: #aab4c7;
  font-size: 13px;
  margin-bottom: 24px;
}

label {
  display: block;

  color: #b9c2d3;

  font-size: 13px;

  margin-bottom: 8px;
}

.gender-buttons {
  display: flex;
  gap: 10px;
}

.gender-buttons button {
  flex: 1;
  margin-top: 0;
}

.gender-buttons button.active {
  background: #7f8da8;
  color: white;
}

input {
  width: 100%;

  padding: 15px;

  border-radius: 13px;

  border: 1px solid #344056;

  background: #080c14;

  color: white;

  font-size: 16px;

  outline: none;

  /*
    IMPORTANT:
    Do not transform the input.
    The generated result handles the style.
  */
}

input::placeholder {
  color: #667085;
}

input:focus {
  border-color: #8c9ab5;
}

.preview {
  margin-top: 20px;

  padding: 22px 10px;

  background: #080c14;

  border: 1px solid #344056;

  border-radius: 16px;

  text-align: center;

  overflow-x: auto;
}

.preview-title {
  color: #8792a7;

  font-size: 12px;

  margin-bottom: 10px;
}

#result {
  font-size: 22px;

  font-weight: bold;

  white-space: nowrap;
}

button {
  width: 100%;

  margin-top: 14px;

  padding: 14px;

  border: none;

  border-radius: 13px;

  background: white;

  color: #080b12;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    opacity 0.15s ease;
}

button:active {
  transform: scale(0.97);
}

button:hover {
  opacity: 0.92;
}

.copy-success {
  background: #7f8da8 !important;
  color: white !important;
}

.info {
  text-align: center;

  margin-top: 18px;

  color: #778298;

  font-size: 11px;
}

@media (max-width: 480px) {

  body {
    padding: 10px;
    align-items: center;
  }

  .card {
    padding: 22px 18px;
    border-radius: 20px;
  }

  .guild-logo {
    width: 90px;
    height: 90px;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 20px;
  }

  .subtitle {
    font-size: 12px;
    margin-bottom: 20px;
  }

  label {
    font-size: 12px;
  }

  input {
    padding: 14px;
    font-size: 16px;
  }

  button {
    padding: 14px;
    font-size: 14px;
  }

  #result {
    font-size: 19px;
  }

  .preview {
    padding: 20px 8px;
  }

}

@media (max-width: 360px) {

  .card {
    padding: 20px 14px;
  }

  .guild-logo {
    width: 80px;
    height: 80px;
  }

  h1 {
    font-size: 18px;
  }

  #result {
    font-size: 17px;
  }

}

</style>

</head>


<body>

<div class="card">

<img
src="logo.png"
alt="THE CONQUEROR Logo"
class="guild-logo">


<h1>
ᴛʜᴇㅤᴄᴏɴǫᴜᴇʀᴏʀ
</h1>


<div class="subtitle">
Guild Name Generator
</div>


<label>
Choose your style
</label>


<div class="gender-buttons">

<button
id="maleBtn"
class="active"
onclick="selectStyle('male')">
⚔ MALE
</button>


<button
id="femaleBtn"
onclick="selectStyle('female')">
♡ FEMALE
</button>

</div>


<label
for="name"
style="margin-top:20px;">

Enter your Free Fire name

</label>


<input
id="name"
type="text"
maxlength="20"
placeholder="Enter your name"
autocomplete="off"
oninput="generateName()">


<div class="preview">

<div class="preview-title">
YOUR GUILD NAME
</div>


<div id="result">
ᴛᴄㅤɴᴀᴍᴇ
</div>

</div>


<button
id="copyButton"
onclick="copyName()">

📋 COPY NAME

</button>


<div class="info">

Official ᴛʜᴇㅤᴄᴏɴǫᴜᴇʀᴏʀ name format

</div>

</div>


<script>


/* =====================================
   CURRENT STYLE
===================================== */

let selectedStyle = "male";


/* =====================================
   PREFIXES
===================================== */

const MALE_PREFIX = "ᴛᴄㅤ";

const FEMALE_PREFIX = "ᴛᴄㅤ♡ㅤ";


/* =====================================
   SMALL-CAP CHARACTER MAP
===================================== */

const SMALL_CAPS = {

  "a": "ᴀ",
  "b": "ʙ",
  "c": "ᴄ",
  "d": "ᴅ",
  "e": "ᴇ",
  "f": "ꜰ",
  "g": "ɢ",
  "h": "ʜ",
  "i": "ɪ",
  "j": "ᴊ",
  "k": "ᴋ",
  "l": "ʟ",
  "m": "ᴍ",
  "n": "ɴ",
  "o": "ᴏ",
  "p": "ᴘ",

  /*
    Unicode has no true small-cap Q.
    Keep q lowercase.
  */
  "q": "q",

  "r": "ʀ",

  /*
    Unicode has no true small-cap S.
    Keep s lowercase.
  */
  "s": "s",

  "t": "ᴛ",
  "u": "ᴜ",
  "v": "ᴠ",
  "w": "ᴡ",

  /*
    Unicode has no true small-cap X.
    Keep x lowercase.
  */
  "x": "x",

  "y": "ʏ",
  "z": "ᴢ"

};


/* =====================================
   SMALL-CAP CONVERTER
===================================== */

function convertToSmallCaps(name) {

  let output = "";

  for (const character of name) {

    const lower =
      character.toLowerCase();

    if (SMALL_CAPS[lower]) {

      output += SMALL_CAPS[lower];

    } else {

      /*
        Numbers, spaces and symbols
        remain unchanged.
      */

      output += character;

    }

  }

  return output;

}


/* =====================================
   SELECT MALE / FEMALE
===================================== */

function selectStyle(style) {

  selectedStyle = style;


  const maleBtn =
    document.getElementById("maleBtn");

  const femaleBtn =
    document.getElementById("femaleBtn");


  if (style === "male") {

    maleBtn.classList.add("active");

    femaleBtn.classList.remove("active");

  } else {

    femaleBtn.classList.add("active");

    maleBtn.classList.remove("active");

  }


  generateName();

}


/* =====================================
   GENERATE NAME
===================================== */

function generateName() {

  const input =
    document.getElementById("name");

  const result =
    document.getElementById("result");


  /*
    Get exactly what the player typed.
  */

  const name =
    input.value.trim();


  /*
    Choose the correct prefix.
  */

  const prefix =
    selectedStyle === "male"
      ? MALE_PREFIX
      : FEMALE_PREFIX;


  /*
    Show preview if no name entered.
  */

  if (name === "") {

    const previewName =
      selectedStyle === "male"
        ? "name"
        : "femalename";


    result.textContent =
      prefix + convertToSmallCaps(previewName);


    return;

  }


  /*
    Convert the player's name
    directly into small-cap Unicode.
  */

  const convertedName =
    convertToSmallCaps(name);


  /*
    Final guild name.
  */

  result.textContent =
    prefix + convertedName;

}


/* =====================================
   COPY
===================================== */

async function copyName() {

  const result =
    document.getElementById("result").textContent;


  const copyButton =
    document.getElementById("copyButton");


  const input =
    document.getElementById("name").value.trim();


  if (input === "") {

    copyButton.textContent =
      "⚠ ENTER YOUR NAME";


    setTimeout(() => {

      copyButton.textContent =
        "📋 COPY NAME";

    }, 1800);


    return;

  }


  try {

    await navigator.clipboard.writeText(result);

  }

  catch (error) {

    const temporary =
      document.createElement("textarea");


    temporary.value =
      result;


    document.body.appendChild(
      temporary
    );


    temporary.select();


    document.execCommand("copy");


    temporary.remove();

  }


  copyButton.textContent =
    "✓ COPIED!";


  copyButton.classList.add(
    "copy-success"
  );


  setTimeout(() => {

    copyButton.textContent =
      "📋 COPY NAME";


    copyButton.classList.remove(
      "copy-success"
    );

  }, 1800);

}


/* =====================================
   INITIAL PREVIEW
===================================== */

generateName();

</script>

</body>

</html>
