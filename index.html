<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>THEㅤ⚔ㅤCONQUEROR</title>

<link rel="icon"
type="image/png"
href="logo.png">

<link rel="manifest"
href="manifest.json">


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 16px;

    font-family: Arial, sans-serif;

    color: white;

    background:

        linear-gradient(
            rgba(5,7,11,0.90),
            rgba(5,7,11,0.96)
        ),

        url("logo.png");

    background-size: 380px;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;

}


/* =========================
   CARD
========================= */

.card {

    width: 100%;

    max-width: 430px;

    background:
        rgba(13,18,29,0.97);

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius: 24px;

    padding: 26px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.55);

}


/* =========================
   LOGO
========================= */

.guild-logo {

    width: 105px;

    height: 105px;

    object-fit: contain;

    display: block;

    margin: 0 auto 12px;

}


/* =========================
   TITLE
========================= */

h1 {

    text-align: center;

    font-size: 23px;

    margin: 8px 0;

}


.subtitle {

    text-align: center;

    color: #aab4c7;

    font-size: 13px;

    margin-bottom: 24px;

}


/* =========================
   LABELS
========================= */

label {

    display: block;

    color: #b9c2d3;

    font-size: 13px;

    margin-bottom: 8px;

}


/* =========================
   STYLE BUTTONS
========================= */

.gender-buttons {

    display: flex;

    gap: 10px;

}


.gender-buttons button {

    flex: 1;

    margin-top: 0;

}


.gender-buttons button.active {

    background: #7f8da8;

    color: white;

}


/* =========================
   INPUT
========================= */

input {

    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid #344056;

    background: #080c14;

    color: white;

    font-size: 16px;

    outline: none;

    text-transform: uppercase;

}


input::placeholder {

    text-transform: none;

    color: #667085;

}


input:focus {

    border-color: #8c9ab5;

}


/* =========================
   PREVIEW
========================= */

.preview {

    margin-top: 20px;

    padding: 22px 10px;

    background: #080c14;

    border:
        1px solid #344056;

    border-radius: 16px;

    text-align: center;

    overflow-x: auto;

}


.preview-title {

    color: #8792a7;

    font-size: 12px;

    margin-bottom: 10px;

}


#result {

    font-size: 22px;

    font-weight: bold;

    white-space: nowrap;

}


/* =========================
   BUTTONS
========================= */

button {

    width: 100%;

    margin-top: 14px;

    padding: 14px;

    border: none;

    border-radius: 13px;

    background: white;

    color: #080b12;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;

}


button:active {

    transform: scale(0.97);

}


button:hover {

    opacity: 0.92;

}


/* =========================
   COPY SUCCESS
========================= */

.copy-success {

    background: #7f8da8 !important;

    color: white !important;

}


/* =========================
   INFO
========================= */

.info {

    text-align: center;

    margin-top: 18px;

    color: #778298;

    font-size: 11px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {

        padding: 10px;

        align-items: center;

    }


    .card {

        padding: 22px 18px;

        border-radius: 20px;

    }


    .guild-logo {

        width: 90px;

        height: 90px;

        margin-bottom: 10px;

    }


    h1 {

        font-size: 20px;

    }


    .subtitle {

        font-size: 12px;

        margin-bottom: 20px;

    }


    label {

        font-size: 12px;

    }


    input {

        padding: 14px;

        font-size: 16px;

    }


    button {

        padding: 14px;

        font-size: 14px;

    }


    #result {

        font-size: 19px;

    }


    .preview {

        padding: 20px 8px;

    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 360px) {

    .card {

        padding: 20px 14px;

    }


    .guild-logo {

        width: 80px;

        height: 80px;

    }


    h1 {

        font-size: 18px;

    }


    #result {

        font-size: 17px;

    }

}

</style>

</head>


<body>


<div class="card">


    <!-- GUILD LOGO -->

    <img

        src="logo.png"

        alt="THEㅤ⚔ㅤCONQUEROR Logo"

        class="guild-logo"

    >


    <!-- GUILD NAME -->

    <h1>

        THEㅤ⚔ㅤCONQUEROR

    </h1>


    <div class="subtitle">

        Guild Name Generator

    </div>


    <!-- STYLE -->

    <label>

        Choose your style

    </label>


    <div class="gender-buttons">


        <button

            id="maleBtn"

            class="active"

            onclick="selectStyle('male')">

            ⚔ MALE

        </button>


        <button

            id="femaleBtn"

            onclick="selectStyle('female')">

            ♡ FEMALE

        </button>


    </div>


    <!-- NAME INPUT -->

    <label

        for="name"

        style="margin-top:20px;">

        Enter your Free Fire name

    </label>


    <input

        id="name"

        type="text"

        maxlength="20"

        placeholder="Enter your name"

        autocomplete="off"

        oninput="generateName()"

    >


    <!-- PREVIEW -->

    <div class="preview">


        <div class="preview-title">

            YOUR GUILD NAME

        </div>


        <div id="result">

            TCㅤ⚔ㅤＮＡＭＥ

        </div>


    </div>


    <!-- COPY BUTTON -->

    <button

        id="copyButton"

        onclick="copyName()">

        📋 COPY NAME

    </button>


    <div class="info">

        Official THEㅤ⚔ㅤCONQUEROR name format

    </div>


</div>


<script>


/* =========================
   SETTINGS
========================= */

let selectedStyle = "male";


const MALE_PREFIX =

    "TCㅤ⚔ㅤ";


const FEMALE_PREFIX =

    "TCㅤ♡ㅤ";


/* =========================
   FULL WIDTH TEXT
========================= */

function fullWidth(text) {


    return [...text].map(character => {


        const code =

            character.charCodeAt(0);


        if (

            code >= 33 &&

            code <= 126

        ) {


            return String.fromCharCode(

                code + 65248

            );

        }


        if (

            character === " "

        ) {


            return "　";

        }


        return character;


    }).join("");

}


/* =========================
   SELECT STYLE
========================= */

function selectStyle(style) {


    selectedStyle = style;


    const maleBtn =

        document.getElementById(

            "maleBtn"

        );


    const femaleBtn =

        document.getElementById(

            "femaleBtn"

        );


    if (

        style === "male"

    ) {


        maleBtn.classList.add(

            "active"

        );


        femaleBtn.classList.remove(

            "active"

        );


    }

    else {


        femaleBtn.classList.add(

            "active"

        );


        maleBtn.classList.remove(

            "active"

        );

    }


    generateName();

}


/* =========================
   GENERATE NAME
========================= */

function generateName() {


    const input =

        document.getElementById(

            "name"

        );


    /* Automatically change typed
       letters to CAPITAL letters */

    const cursorPosition =

        input.selectionStart;


    input.value =

        input.value.toUpperCase();


    try {

        input.setSelectionRange(

            cursorPosition,

            cursorPosition

        );

    }

    catch (error) {}


    const name =

        input.value.trim();


    const result =

        document.getElementById(

            "result"

        );


    if (

        name.length === 0

    ) {


        if (

            selectedStyle === "male"

        ) {


            result.textContent =

                "TCㅤ⚔ㅤＮＡＭＥ";


        }

        else {


            result.textContent =

                "TCㅤ♡ㅤＦＥＭＡＬＥＮＡＭＥ";

        }


        return;

    }


    const prefix =

        selectedStyle === "male"

        ? MALE_PREFIX

        : FEMALE_PREFIX;


    result.textContent =

        prefix + fullWidth(name);

}


/* =========================
   COPY NAME
========================= */

async function copyName() {


    const result =

        document.getElementById(

            "result"

        ).textContent;


    const copyButton =

        document.getElementById(

            "copyButton"

        );


    if (

        result ===

        "TCㅤ⚔ㅤＮＡＭＥ"

        ||

        result ===

        "TCㅤ♡ㅤＦＥＭＡＬＥＮＡＭＥ"

    ) {


        copyButton.textContent =

            "⚠ ENTER YOUR NAME";


        setTimeout(() => {

            copyButton.textContent =

                "📋 COPY NAME";

        }, 1800);


        return;

    }


    try {


        await navigator.clipboard.writeText(

            result

        );


    }

    catch (error) {


        const temporary =

            document.createElement(

                "textarea"

            );


        temporary.value = result;


        document.body.appendChild(

            temporary

        );


        temporary.select();


        document.execCommand(

            "copy"

        );


        temporary.remove();

    }


    /* Success animation */

    copyButton.textContent =

        "✓ COPIED!";


    copyButton.classList.add(

        "copy-success"

    );


    setTimeout(() => {


        copyButton.textContent =

            "📋 COPY NAME";


        copyButton.classList.remove(

            "copy-success"

        );


    }, 1800);

}

</script>


</body>

</html>
