<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE ⚔ CONQUEROR — Name Generator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #26334d,
            #0b0f18 50%,
            #05070b
        );

    color: white;
}


/* MAIN CARD */

.card {
    width: 100%;
    max-width: 430px;

    background: rgba(13,18,29,0.96);

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 24px;

    padding: 28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5);
}


/* TOP SYMBOL */

.crest {
    text-align: center;

    font-size: 45px;

    margin-bottom: 5px;
}


/* TITLE */

h1 {
    text-align: center;

    font-size: 24px;

    margin: 8px 0;
}


/* SUBTITLE */

.subtitle {
    text-align: center;

    color: #aab4c7;

    font-size: 14px;

    margin-bottom: 25px;
}


/* LABEL */

label {
    display: block;

    color: #b9c2d3;

    font-size: 13px;

    margin-bottom: 8px;
}


/* MALE / FEMALE BUTTONS */

.gender-buttons {
    display: flex;

    gap: 10px;
}

.gender-buttons button {
    flex: 1;
}

.gender-buttons button.active {
    background: #7f8da8;

    color: white;
}


/* NAME INPUT */

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #344056;

    background: #080c14;

    color: white;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #8c9ab5;
}


/* PREVIEW */

.preview {
    margin-top: 20px;

    padding: 22px 10px;

    background: #080c14;

    border: 1px solid #344056;

    border-radius: 16px;

    text-align: center;

    overflow-x: auto;
}


/* PREVIEW TITLE */

.preview-title {
    color: #8792a7;

    font-size: 12px;

    margin-bottom: 10px;
}


/* GENERATED NAME */

#result {
    font-size: 22px;

    font-weight: bold;

    white-space: nowrap;
}


/* BUTTONS */

button {
    width: 100%;

    margin-top: 14px;

    padding: 14px;

    border: none;

    border-radius: 13px;

    background: white;

    color: #080b12;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


/* BUTTON PRESS EFFECT */

button:active {
    transform: scale(0.98);
}


/* INFO */

.info {
    text-align: center;

    margin-top: 18px;

    color: #778298;

    font-size: 11px;
}

</style>

</head>


<body>


<div class="card">


    <!-- GUILD SYMBOL -->

    <div class="crest">
        ⚔
    </div>


    <!-- GUILD NAME -->

    <h1>
        THEㅤ⚔ㅤCONQUEROR
    </h1>


    <div class="subtitle">
        Guild Name Generator
    </div>



    <!-- STYLE SELECTION -->

    <label>
        Choose your style
    </label>


    <div class="gender-buttons">


        <button
            id="maleBtn"
            class="active"
            onclick="selectStyle('male')">

            ⚔ MALE

        </button>


        <button
            id="femaleBtn"
            onclick="selectStyle('female')">

            ♡ FEMALE

        </button>


    </div>



    <!-- NAME INPUT -->

    <label
        for="name"
        style="margin-top:20px;">

        Enter your Free Fire name

    </label>


    <input
        id="name"
        type="text"
        maxlength="20"
        placeholder="Enter your name"
        autocomplete="off"
        oninput="generateName()"
    >



    <!-- NAME PREVIEW -->

    <div class="preview">


        <div class="preview-title">

            YOUR GUILD NAME

        </div>


        <div id="result">

            TCㅤ⚔ㅤＮＡＭＥ

        </div>


    </div>



    <!-- COPY BUTTON -->

    <button onclick="copyName()">

        📋 COPY NAME

    </button>



    <div class="info">

        Official THEㅤ⚔ㅤCONQUEROR name format

    </div>


</div>



<script>


/* CURRENT STYLE */

let selectedStyle = "male";



/* NAME PREFIXES */

const MALE_PREFIX =
    "TCㅤ⚔ㅤ";

const FEMALE_PREFIX =
    "TCㅤ♡ㅤ";



/* FULL WIDTH CONVERTER */

function fullWidth(text) {


    return [...text].map(character => {


        const code =
            character.charCodeAt(0);


        /* Convert normal characters */

        if (
            code >= 33 &&
            code <= 126
        ) {

            return String.fromCharCode(
                code + 65248
            );

        }


        /* Convert spaces */

        if (
            character === " "
        ) {

            return "　";

        }


        return character;


    }).join("");

}



/* SELECT MALE OR FEMALE */

function selectStyle(style) {


    selectedStyle = style;


    const maleBtn =
        document.getElementById(
            "maleBtn"
        );


    const femaleBtn =
        document.getElementById(
            "femaleBtn"
        );



    if (
        style === "male"
    ) {


        maleBtn.classList.add(
            "active"
        );


        femaleBtn.classList.remove(
            "active"
        );


    }

    else {


        femaleBtn.classList.add(
            "active"
        );


        maleBtn.classList.remove(
            "active"
        );


    }


    generateName();

}



/* GENERATE NAME */

function generateName() {


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const result =
        document.getElementById(
            "result"
        );



    /* Empty name */

    if (
        name.length === 0
    ) {


        if (
            selectedStyle === "male"
        ) {


            result.textContent =
                "TCㅤ⚔ㅤＮＡＭＥ";


        }

        else {


            result.textContent =
                "TCㅤ♡ㅤＦＥＭＡＬＥＮＡＭＥ";


        }


        return;

    }



    /* Choose prefix */

    const prefix =
        selectedStyle === "male"
        ? MALE_PREFIX
        : FEMALE_PREFIX;



    /* Show generated name */

    result.textContent =
        prefix + fullWidth(name);

}



/* COPY NAME */

async function copyName() {


    const result =
        document.getElementById(
            "result"
        ).textContent;



    /* Prevent copying empty result */

    if (

        result ===
        "TCㅤ⚔ㅤＮＡＭＥ"

        ||

        result ===
        "TCㅤ♡ㅤＦＥＭＡＬＥＮＡＭＥ"

    ) {


        alert(
            "Enter your name first!"
        );


        return;

    }



    /* Copy */

    try {


        await navigator.clipboard.writeText(
            result
        );


        alert(
            "Copied: " + result
        );


    }


    catch (error) {


        const temporary =
            document.createElement(
                "textarea"
            );


        temporary.value =
            result;


        document.body.appendChild(
            temporary
        );


        temporary.select();


        document.execCommand(
            "copy"
        );


        temporary.remove();


        alert(
            "Name copied!"
        );

    }

}

</script>


</body>

</html>
